name: Build ORIS Mobile Audio APK

on:
  push:
    branches:
      - android-audio-streamer
    paths:
      - 'android-streamer/**'
      - '.github/workflows/build-android-streamer.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'android-streamer/**'
      - '.github/workflows/build-android-streamer.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Assemble native base sources
        run: python3 android-streamer/tools/assemble_native.py

      - name: Prepare audio and Sendspin
        run: python3 android-streamer/tools/prepare_native_build.py

      - name: Assemble verified 0.3.3 payloads
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64

          root = Path('android-streamer/tools')
          encoded_parts = sorted((root / 'v033_patch_encoded').glob('*.b64x'))
          patch = ''.join(
              base64.b64decode(part.read_text(encoding='utf-8').strip()).decode('ascii')
              for part in encoded_parts
          )
          (root / 'v033' / 'apply_v033.py.gz.b64').write_text(patch, encoding='utf-8')

          service_parts = [
              root / 'v033' / 'RadioNotificationService.java.gz.b64.00',
              root / 'v033' / 'RadioNotificationService.java.gz.b64.01',
          ]
          service = ''.join(part.read_text(encoding='utf-8').strip() for part in service_parts)
          (root / 'v033' / 'RadioNotificationService.java.gz.b64').write_text(service, encoding='utf-8')
          print('Patch payload length:', len(patch))
          print('Service payload length:', len(service))
          PY

      - name: Apply native app versions 0.3.1 to 0.3.3
        run: |
          set +e
          python3 android-streamer/tools/apply_v031.py > apply-v033.log 2>&1
          code=$?
          cat apply-v033.log
          exit $code

      - name: Upload patch diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ORIS-Mobile-Audio-v0.3.3-diagnostics
          path: apply-v033.log
          if-no-files-found: error

      - name: Build debug APK
        run: gradle -p android-streamer :app:assembleDebug --stacktrace

      - name: Prepare artifacts
        run: |
          mkdir -p dist
          cp android-streamer/app/build/outputs/apk/debug/app-debug.apk dist/ORIS-Mobile-Audio-v0.3.3.apk
          cp -a android-streamer dist/ORIS-Mobile-Audio-v0.3.3-source
          rm -rf dist/ORIS-Mobile-Audio-v0.3.3-source/app/build dist/ORIS-Mobile-Audio-v0.3.3-source/.gradle
          cd dist
          zip -qr ORIS-Mobile-Audio-v0.3.3-source.zip ORIS-Mobile-Audio-v0.3.3-source

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ORIS-Mobile-Audio-v0.3.3-APK
          path: dist/ORIS-Mobile-Audio-v0.3.3.apk
          if-no-files-found: error

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: ORIS-Mobile-Audio-v0.3.3-source
          path: dist/ORIS-Mobile-Audio-v0.3.3-source.zip
          if-no-files-found: error
