name: Build ORIS Mobile Audio APK

on:
  push:
    branches:
      - android-audio-streamer
    paths:
      - 'android-streamer/**'
      - '.github/workflows/build-android-streamer.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'android-streamer/**'
      - '.github/workflows/build-android-streamer.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build debug APK
        run: gradle -p android-streamer :app:assembleDebug --stacktrace

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp android-streamer/app/build/outputs/apk/debug/app-debug.apk dist/ORIS-Mobile-Audio.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ORIS-Mobile-Audio-APK
          path: dist/ORIS-Mobile-Audio.apk
          if-no-files-found: error
